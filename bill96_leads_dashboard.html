function buildIndustryFilters(){
  const inds = [...new Set(LEADS.map(l=>l.industry))].sort();
  const el = document.getElementById('ind-filters');
  el.innerHTML = `<button class="fb active" data-f="ind" data-v="all" onclick="setFilter('ind','all',this)">All <span class="cnt">${LEADS.length}</span></button>` +
    inds.map(ind => {
      const cnt = LEADS.filter(l=>l.industry===ind).length;
      const safe = ind.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<button class="fb" data-f="ind" data-v="${ind}" onclick="setFilter('ind','${safe}',this)">${ind} <span class="cnt">${cnt}</span></button>`;
    }).join('');
}

    if(FILTERS.tier!=='all' && tier(l.score,l.first,l.last)!==FILTERS.tier) return false;
    if(FILTERS.ind!=='all' && l.industry!==FILTERS.ind) return false;
    if(FILTERS.sen!=='all' && l.seniority!==FILTERS.sen) return false;
    if(FILTERS.cty!=='all'){
      if(FILTERS.cty==='Other'){ if(l.country==='Canada'||l.country==='United States') return false; }
      else if(l.country!==FILTERS.cty) return false;
    }
    if(q){
      const b=[l.first,l.last,l.company,l.title,l.industry,l.seniority].join(' ').toLowerCase();
      if(!b.includes(q)) return false;
    }
    return true;
  });
}

function setFilter(type,val,btn){
  FILTERS[type]=val;
  document.querySelectorAll(`[data-f="${type}"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function resetFilters(){
  Object.keys(FILTERS).forEach(k=>FILTERS[k]='all');
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('active',b.dataset.v==='all'));
  render();
}

function render(){
  const data = filtered();
  document.getElementById('rc').textContent = data.length;
  if(VIEW==='cards') renderCards(data);
  else renderTable(data);
}

function flag(c){ return c==='Canada'?'🇨🇦':c==='United States'?'🇺🇸':'🌎'; }

function renderCards(data){
  const g = document.getElementById('cardGrid');
  if(!data.length){ g.innerHTML='<div class="empty"><p style="font-size:24px;margin-bottom:8px">🔍</p><p>No leads match your filters.</p></div>'; return; }
  g.innerHTML = data.map(l=>`
    <div class="card" onclick="showDetail(${l.id})">
      <div class="card-top">
        <div>
          <div class="card-name">${l.first} ${l.last}</div>
          <div class="card-company">${l.company}</div>
        </div>
        <div class="sb ${scls(l.score,l.first,l.last)}">${l.score}</div>
      </div>
      <div class="card-title">${l.title}</div>
      <div class="card-tags">
        <span class="tag ti">${l.industry}</span>
        <span class="tag ts">${l.seniority}</span>
        <span class="tag tc">${flag(l.country)} ${l.country||'Unknown'}</span>
      </div>
      <div class="card-footer">
        <span style="font-size:10px;color:var(--muted)">${l.dept||'—'}</span>
        <span style="font-size:10px;font-weight:600" class="${tclass(l.score,l.first,l.last)}">${tlabel(l.score,l.first,l.last)}</span>
      </div>
    </div>`).join('');
}

function renderTable(data){
  const w = document.getElementById('tableWrap');
  if(!data.length){ w.innerHTML='<div class="empty"><p>No leads match your filters.</p></div>'; return; }
  w.innerHTML = `<table><thead><tr><th>Name</th><th>Company</th><th>Job Title</th><th>Industry</th><th>Score</th><th>Seniority</th><th>Country</th></tr></thead><tbody>` +
    data.map(l=>`<tr onclick="showDetail(${l.id})">
      <td>${l.first} ${l.last}</td>
      <td>${l.company}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.title}</td>
      <td><span class="tag ti" style="font-size:10px">${l.industry}</span></td>
      <td><span class="sb ${scls(l.score,l.first,l.last)}" style="width:auto;height:auto;padding:3px 8px;border-radius:5px;font-size:11px">${l.score}</span></td>
      <td>${l.seniority}</td>
      <td>${flag(l.country)} ${l.country||'—'}</td>
    </tr>`).join('') + '</tbody></table>';
}

function showDetail(id){
  const l = LEADS[id];
  document.getElementById('dp').classList.remove('hidden');
  const t = tier(l.score,l.first,l.last);
  const tc2 = t==='hot'?'th':t==='warm'?'tw':'tco';
  const tl = t==='hot'?'Hot lead (form fill)':t==='warm'?'Warm lead (75+)':'Cold lead';
  const cohort = COHORT[id] || (t==='hot'?'Strong cohort candidate. Enrich in AudienceAI to identify trigger type before adding to cohort program.':t==='warm'?'Warm lead — monitor score. Good candidate for cohort once threshold is reached.':'Cold lead — keep in Stage 1 vertical nurture until score improves.');
  document.getElementById('di').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
      <div><div class="dn">${l.first} ${l.last}</div><div class="dt">${l.title}<br><strong>${l.company}</strong></div></div>
      <button class="cb" onclick="closeDetail()">✕</button>
    </div>
    <div class="dsr">
      <div class="dsb ${scls(l.score,l.first,l.last)}">${l.score}</div>
      <div class="dst"><div class="dsl">Pardot Score</div><div class="dss ${tc2}">${tl}</div><div style="font-size:10px;color:var(--muted);margin-top:2px">${l.seniority} level</div></div>
    </div>
    <div class="crec"><div class="crect">Cohort recommendation</div><div class="crecv">${cohort}</div></div>
    <div class="ds">
      <div class="dst2">Lead details</div>
      <div class="dr"><span class="dl">Department</span><span class="dv">${l.dept||'—'}</span></div>
      <div class="dr"><span class="dl">Country</span><span class="dv">${flag(l.country)} ${l.country||'—'}</span></div>
      <div class="dr"><span class="dl">Seniority</span><span class="dv">${l.seniority}</span></div>
      <div class="dr"><span class="dl">Email</span><span class="dv" style="font-size:10px;word-break:break-all">${l.email}</span></div>
    </div>
    <div class="ds">
      <div class="dst2">Industry (enriched)</div>
      <div class="dr"><span class="dl">Industry</span><span class="dv"><span class="tag ti">${l.industry}</span></span></div>
      <div class="dr"><span class="dl">Why</span><span class="dv" style="color:var(--muted);font-size:10px;font-weight:400">${l.industry_reason}</span></div>
    </div>`;
}

function closeDetail(){
  document.getElementById('dp').classList.add('hidden');
}

function setView(v){
  VIEW=v;
  document.getElementById('btnC').classList.toggle('active',v==='cards');
  document.getElementById('btnT').classList.toggle('active',v==='table');
  document.getElementById('cardGrid').style.display=v==='cards'?'grid':'none';
  document.getElementById('tableWrap').style.display=v==='table'?'block':'none';
  render();
}

buildIndustryFilters();
render();
</script>
</body>
</html>
